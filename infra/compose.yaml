services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: luxurious
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
      POSTGRES_DB: luxurious
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxurious -d luxurious"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
